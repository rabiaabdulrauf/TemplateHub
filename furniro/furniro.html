<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style/furniro.css" />
    <link rel="stylesheet" href="style/furniro-media.css" />
    <title>Furniro</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">
          <img src="assets/fr logo.png" alt="" width="150px" class="picture" />
        </div>
        <div class="navbar">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </div>
        <div class="icon">
          <i class="fa-regular fa-user fa-lg" style="color: #0d0d0d"></i>
          <i
            class="fa-solid fa-magnifying-glass fa-lg"
            style="color: #030303"
          ></i>
          <i class="fa-regular fa-heart fa-lg" style="color: #0d0d0d"></i>
          <i class="fa-solid fa-cart-shopping fa-lg" style="color: #0c0d0d"></i>
        </div>
      </div>
      <div class="img">
        <img src="assets/sc.png" alt="" class="bg" />
      </div>
      <div class="shop">
        <div class="info">
          <span>New Arrival</span>
          <h1>Discover Our New Collection</h1>
          <span class="collection"
            >Explore our newest collection of home decor essentials, designed to
            make your space cozy and inviting.</span
          >
          <div class="button">
            <button>Buy Now</button>
          </div>
        </div>
      </div>
      <div class="browse">
        <h3>Browse The Range</h3>
        <div class="range">
          <p>Browse our extensive range of furniture.</p>
        </div>
        <div class="things">
          <div class="table">
            <img src="assets/table.png" alt="table" class="furn" />
            <p>Dining</p>
          </div>
          <div class="dining">
            <img src="assets/living.png" alt="dining" class="furn" />
            <p>Living</p>
          </div>
          <div class="bed">
            <img src="assets/bedroom.png" alt="bedroom" class="furn" />
            <p>Bedroom</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
