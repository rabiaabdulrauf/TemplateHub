<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight | Booking Page</title>
    <link rel="stylesheet" href="style/flight.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style/flight-media.css">
</head>
<body>
    <!-------------------------flight------------>
   <div class="flight">
    <div class="direction">
       <div class="logo">
    <img src="assets/logo.png" alt="" class="logo-pic"><span>Flight</span>
       </div>
       <div class="social">
    <h1>Choose Your Direction </h1>
       <div class="facebook">
          <h2>Find Us on Facebook</h2>
          <i class="fa-brands fa-facebook-f" style="padding-left: .5em;"></i>
       </div>
       <div class="channel">
        <h2>Our Youtube Channel </h2>
        <i class="fa-brands fa-youtube"></i>
       </div>
       <div class="insta">
        <h2>Follow Our Instagram</h2>
        <i class="fa-brands fa-instagram"></i>
       </div>
       
       </div>
    </div>
    <div class="form">
        <h5>Check availability for direction:</h5>
        <hr>
        <form>
            <div class="left">
            <h6>FROM:</h6>
           <select >
            <option>Select a location</option>
            <option>Pakistan</option>
            <option>France</option>
            <option>Dubai</option>
            <option>Turkey</option>
            <option>German</option>
            <option>Brazil</option>
            <option>Itlay</option>
            <option>Japan</option>
           </select>
           <h6>Departure date:</h6>
           <input type="date">
           <h6>ROOM</h6>
           <select>
            <option>select Rooms</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
           </select>

        </div>
        <div class="right">
            <h6>TO:</h6>
            <select >
                <option>Select a location</option>
                <option>Pakistan</option>
            <option>France</option>
            <option>Dubai</option>
            <option>Turkey</option>
            <option>German</option>
            <option>Brazil</option>
            <option>Itlay</option>
            <option>Japan</option>
               </select>
               <h6>RETURN date:</h6>
               <input type="date" >
                 <button>Order Ticket Now</button>
        </div>  
        </form>

    </div>
   </div>
    
</body>
</html>
